# One collector per person: your own Google account, your own data.
# Nothing is published beyond the host loopback (127.0.0.1).
services:
  502drive:
    build:
      context: .
      dockerfile: Dockerfile
    image: 502drive:latest
    container_name: 502drive
    restart: unless-stopped
    # Let in-flight jobs reach a safe point before Docker sends SIGKILL.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # The daemon reads config JSON (listen, data_dir, token_file, ...).
      - DRIVE502_CONFIG=/config/config.json
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # HTTP API: reachable at http://127.0.0.1:5020 on the host only.
      - "127.0.0.1:5020:5020"
      # Fixed loopback OAuth callback, used by `account login`.
      - "127.0.0.1:50200:50200"
    volumes:
      # config.json + API token + copied secrets (created by `502drive setup
      # --container`); never bake secrets into the image.
      # :z relabels for SELinux hosts (Fedora); harmless elsewhere.
      - ./config:/config:z
      # state-v2.db, master key, Google token, instance.lock.
      - 502drive-data:/data
    # The container runs as nonroot (65532). If your ./config files are owned by
    # another user, either `sudo chown -R 65532:65532 ./config` (Docker) or
    # `podman unshare chown -R 65532:65532 ./config` (rootless Podman).
    # user: "65532:65532"

volumes:
  502drive-data:
    # Fixed name: backup/update commands in the docs can name it exactly.
    name: 502drive-data
