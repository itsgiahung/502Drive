services:
  502drive:
    build:
      context: .
      dockerfile: Dockerfile
    image: 502drive:latest
    container_name: 502drive-bot
    restart: unless-stopped
    command: ["serve"]
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # The Go daemon reads config JSON (data_dir, token_file, listen,
      # oauth_callback_port, ...). Default path inside the image is
      # /config/config.json, which is where the ./config mount lands.
      # - DRIVE502_CONFIG=/config/config.json
    volumes:
      # config.json + API token file (create them with `502drive setup`).
      - ./config:/config
      # Persistent state: state-v2.db, secrets/, instance.lock.
      - ./data:/data
    # The HTTP API binds loopback only, so no public port is published.
    # Google OAuth uses a loopback callback (config key oauth_callback_port);
    # when running `502drive account login` inside the container, forward that
    # port from the host instead of exposing a public inbound port, e.g.:
    # ports:
    #   - "127.0.0.1:50200:50200"
