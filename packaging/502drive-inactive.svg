<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Google Drive Colors with rich gradients -->
    <linearGradient id="driveYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>

    <linearGradient id="driveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <linearGradient id="driveGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Telegram plane gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="8" stroke-dasharray="16 12" opacity="0.8" />

  <!-- Google Drive Triangle Geometry -->
  <g filter="url(#dropShadow)">
    <!-- Yellow side (Top-Right) -->
    <path d="M 180,120 L 332,120 L 415,264 L 339,264 Z" fill="url(#driveYellow)" />
    <!-- Green side (Bottom) -->
    <path d="M 339,264 L 256,408 L 97,408 L 180,264 Z" fill="url(#driveGreen)" />
    <!-- Blue side (Left) -->
    <path d="M 180,120 L 263,264 L 180,408 L 97,264 Z" fill="url(#driveBlue)" />
  </g>

  <!-- Telegram Badge / Circular Core -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="256" r="82" fill="#24A1DE" />
    <!-- Paper Plane Icon -->
    <path d="M 215,255 L 298,220 L 275,296 L 251,273 L 235,285 L 239,265 Z" fill="url(#planeGrad)" />
    <path d="M 251,273 L 273,243 L 239,265 Z" fill="#CBD5E1" opacity="0.8" />
  </g>

  <!-- Active Status Glow Indicator in bottom right of badge -->
  <circle cx="330" cy="330" r="22" fill="#EF4444" stroke="#0F172A" stroke-width="6" filter="url(#softGlow)" />
  <circle cx="330" cy="330" r="10" fill="#FCA5A5" />
</svg>
