version: 2

project_name: 502drive

# Icons and shell completions are generated by the binary itself, so the
# packaged files always match the shipped command tree.
before:
  hooks:
    # Icons come from the tray command, as documented; the assets command adds
    # the shell completions generated from the real command tree.
    - go run ./cmd/502drive tray --write-icons build/assets
    - go run ./cmd/502drive assets --dir build/assets
    # Windows icon resources (pinned tool); the .syso files are generated into
    # build/ and copied next to the packages the linker reads them from.
    - mkdir -p build/winres
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in packaging/windows/winres.json --out build/winres/rsrc --arch amd64
    - cp build/winres/rsrc_windows_amd64.syso cmd/502drive/
    - cp build/winres/rsrc_windows_amd64.syso cmd/502drive-tray/

builds:
  - id: 502drive
    main: ./cmd/502drive
    binary: 502drive
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/itsgiahung/502Drive/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Only linux/amd64, linux/arm64, windows/amd64 and darwin/arm64 are built.
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64

  # Windows GUI-subsystem wrapper: no console window when the tray starts at
  # sign-in. Linux uses `502drive tray` from the single binary.
  - id: 502drive-tray
    main: ./cmd/502drive-tray
    binary: 502drive-tray
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X github.com/itsgiahung/502Drive/internal/cli.Version={{ .Version }}
    goos:
      - windows
    goarch:
      - amd64

archives:
  - id: default
    ids:
      - 502drive
      - 502drive-tray
    # The Windows zip carries the console binary plus the GUI tray wrapper;
    # Linux and macOS only ship the single binary, so the counts differ on
    # purpose.
    allow_different_binary_count: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE.md
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  disable: false
  draft: false
  prerelease: auto
  footer: |
    ### Windows installer

    `502drive-setup.exe` is built by CI from the verified archives and attached
    to this release, with `502drive-setup.exe.sha256`. It is **not code-signed**:
    Windows SmartScreen will warn about an unknown publisher. Verify the
    checksum before running it. Uninstalling keeps your configuration, token and
    copied-job state in `%APPDATA%`/`%LOCALAPPDATA%`.

    ### Linux packages

    `.rpm` and `.deb` install `/usr/bin/502drive`, the systemd **user** unit
    `502drive.service` (not enabled automatically), the tray entry and shell
    completions. Use `systemctl --user start 502drive` or the tray item.

nfpms:
  - id: linux
    package_name: 502drive
    vendor: 502Drive
    homepage: https://github.com/itsgiahung/502Drive
    maintainer: 502Drive contributors
    description: |-
      Copy Google Drive links server-side and keep a copied folder in sync.
      Includes the CLI, the optional HTTP daemon, a tray launcher and shell
      completions.
    license: GPL-3.0-only
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    contents:
      # Short alias: type `502d` instead of `502drive`.
      - src: /usr/bin/502drive
        dst: /usr/bin/502d
        type: symlink
      - src: packaging/502drive.service
        dst: /usr/lib/systemd/user/502drive.service
      - src: packaging/502drive-tray.desktop
        dst: /usr/share/applications/502drive-tray.desktop
      - src: build/assets/502drive.png
        dst: /usr/share/icons/hicolor/256x256/apps/502drive.png
      - src: build/assets/502drive.bash
        dst: /usr/share/bash-completion/completions/502drive
      - src: build/assets/_502drive
        dst: /usr/share/zsh/vendor-completions/_502drive
      - src: build/assets/502drive.fish
        dst: /usr/share/fish/vendor_completions.d/502drive.fish
    rpm:
      group: Applications/Internet
    deb:
      fields:
        Section: net
        Priority: optional
