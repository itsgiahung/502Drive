name: Setup support
description: Ask for help installing or configuring Drive502.
title: "support: "
labels: ["support"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Install method:
        Go version (go version):
        502drive version:
        Running as systemd user / Task Scheduler / manual:
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `502drive doctor` output with secrets redacted.
      render: text
