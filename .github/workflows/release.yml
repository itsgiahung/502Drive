name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Daemon — Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin 502drive

      - name: Package Linux Bundle
        run: |
          chmod +x packaging/package.sh
          ARCH=x86_64 ./packaging/package.sh

      - name: Upload Linux x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: dist/linux/*

  build-linux-arm64:
    name: Daemon — Linux aarch64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target aarch64-unknown-linux-gnu --bin 502drive

      - name: Package Linux ARM64 Bundle
        run: |
          chmod +x packaging/package.sh
          ARCH=aarch64 ./packaging/package.sh

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-release
          path: dist/linux/*

  build-windows:
    name: Daemon — Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Build explicitly with the same target the packager expects, then let
      # the packager only zip prebuilt artifacts (-SkipBuild). This keeps the
      # failure domain small: a packaging error no longer also hides build
      # output, and the packager never rebuilds with different flags.
      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc --bin 502drive

      - name: Package Windows Bundle
        shell: pwsh
        run: .\package-release.ps1 -SkipBuild

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*

  build-gui-linux:
    name: GUI — Linux (deb + AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri bundles (deb, AppImage)
        run: npx @tauri-apps/cli@^2 build --bundles deb,appimage

      - name: Upload GUI Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux-release
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  build-gui-windows:
    name: GUI — Windows (MSI + NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri bundles (msi, nsis)
        run: npx @tauri-apps/cli@^2 build --bundles msi,nsis

      - name: Upload GUI Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-release
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
      - build-gui-linux
      - build-gui-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz*" -o -name "*.zip*" \
            -o -name "*.deb" -o -name "*.AppImage" \
            -o -name "*.msi" -o -name "*setup.exe" \) \
            -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: "502Drive ${{ github.ref_name || inputs.tag_name }}"
          body: |
            ## 🚀 502Drive ${{ github.ref_name || inputs.tag_name }}

            Local-first Google Drive cloning & one-way realtime sync — Telegram bot daemon + desktop GUI.

            ### 📦 Downloads

            #### 🖥️ Desktop GUI (recommended)
            - **Linux**: `502Drive_*.deb` (Debian/Ubuntu) · `*.AppImage` (universal)
            - **Windows**: `*-setup.exe` (NSIS installer) · `*.msi`

            #### 🤖 Daemon / VPS (headless Telegram bot)
            - **Linux x86_64**: `502drive-*-linux-x86_64.tar.gz` → extract, `bash packaging/install.sh`
            - **Linux aarch64**: `502drive-*-linux-aarch64.tar.gz` (Raspberry Pi 4/5, Ampere)
            - **Windows**: `502drive-*-windows-x86_64.zip` (portable, `windows-task.ps1` for autostart)

            #### 🐳 Docker / VPS / NAS
            ```bash
            git clone https://github.com/GiaHung07/502Drive.git
            cd 502Drive
            docker compose up -d
            ```
            See [docs/install-docker.md](https://github.com/GiaHung07/502Drive/blob/main/docs/install-docker.md).

            ---
            *All packages include SHA256 checksums (`.sha256`) for integrity verification.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
