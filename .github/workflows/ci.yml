name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Tests
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: 502drive-linux-x86_64
            bin: target/x86_64-unknown-linux-gnu/release/502drive

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: 502drive-linux-aarch64
            bin: target/aarch64-unknown-linux-gnu/release/502drive

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: 502drive-windows-x86_64
            bin: target/x86_64-pc-windows-msvc/release/502drive.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin 502drive

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bin }}
