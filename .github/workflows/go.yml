name: Go CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: darwin, goarch: arm64, ext: "" }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -o dist/502drive-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/502drive

      - name: Build the GUI tray wrapper (windows)
        if: matrix.goos == 'windows'
        run: go build -trimpath -ldflags "-H=windowsgui" -o dist/502drive-tray-windows-amd64.exe ./cmd/502drive-tray

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: 502drive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
